<body>
  <h1>今日の傘予報</h1>
  <div id="parent">
    <div class="contents">
      <h2>東京の天気</h2>
      <p>今日の天気は雨です。</p>
      <p>傘を持って行ってください。</p>
      <img src="images/rainy.png">
    </div>
    <div class="contents">
      <h2>北海道の天気</h2>
      <p>今日の天気は晴れです。</p>
      <p>傘は必要ないでしょう。</p>
      <img src="images/sunny.png">
    </div>
    <div class="contents">
      <h2>沖縄の天気</h2>
      <p>今日の天気は曇りです。</p>
      <p>折り畳み傘を持って行くと安心です。</p>
      <img src="images/cloudy.png">
    </div>
  </div>
